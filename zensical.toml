[project]
site_name = "Backtesting Engine Documentation"
site_description = "Official documentation of AGH Quant Finance's Backtesting Engine"
site_author = "AGH Quant Finance"
docs_dir = "docs"
site_dir = "docs-site"

[project.theme]
language = "en"
logo = "img/logo.png"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"